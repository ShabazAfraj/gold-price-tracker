name: Gold.de Price Scraper

on:
  schedule:
    # Runs every hour from 9 AM to 5 PM CEST (7 AM to 3 PM UTC), Monday-Friday
    - cron: "0 7-15 * * 1-5"
  
  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
      
      - name: Run scraper
        run: python scraper.py
      
      - name: Commit and push if changed
        run: |
          git config user.name "gold-price-bot"
          git config user.email "action@github.com"
          git add gold_prices.csv
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "chore: record gold prices at $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          )
